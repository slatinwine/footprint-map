<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>足迹地图 · 定位与标注</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* ============ Apple / iOS 设计系统 ============ */
  :root{
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --fill:#EFEFF4;
    --fill2:#E5E5EA;
    --text:#1C1C1E;
    --text2:#3C3C43;
    --muted:#8E8E93;
    --line:rgba(60,60,67,.13);
    --blue:#007AFF; --blue-tint:rgba(0,122,255,.12);
    --red:#FF3B30;  --red-tint:rgba(255,59,48,.10);
    --orange:#FF9500;
    --map-bg:#E4E4E9;
    --glass:rgba(252,252,253,.66);
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#1C1C1E;
      --fill:#2C2C2E;
      --fill2:#3A3A3C;
      --text:#F2F2F7;
      --text2:#EBEBF5;
      --muted:#98989D;
      --line:rgba(84,84,88,.65);
      --blue:#0A84FF; --blue-tint:rgba(10,132,255,.22);
      --red:#FF453A;  --red-tint:rgba(255,69,58,.18);
      --orange:#FF9F0A;
      --map-bg:#111114;
      --glass:rgba(28,28,30,.72);
      --shadow:0 1px 3px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.40);
    }
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",
                 "PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    display:flex; flex-direction:column; height:100dvh;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .muted{color:var(--muted)} .hidden{display:none!important}

  /* ---------- 顶栏(毛玻璃导航)---------- */
  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
    padding-top:calc(10px + env(safe-area-inset-top));
    z-index:1200;
  }
  .brand{font-size:21px; font-weight:800; letter-spacing:-.4px; line-height:1.15; white-space:nowrap}
  .brand small{display:block; font-size:11px; font-weight:500; color:var(--muted); letter-spacing:.2px; margin-top:1px}
  header .actions{margin-left:auto; display:flex; gap:8px}

  /* ---------- 按钮(iOS 胶囊)---------- */
  .btn{
    appearance:none; border:none; border-radius:980px; cursor:pointer;
    padding:9px 16px; font-size:14px; font-weight:600; line-height:1; font-family:inherit;
    background:var(--fill2); color:var(--text);
    transition:transform .12s ease, opacity .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.primary{background:var(--blue); color:#fff}
  .btn.danger{background:var(--red-tint); color:var(--red)}
  .btn.small{padding:6px 13px; font-size:13px}

  .chip{
    appearance:none; border:none; border-radius:980px; cursor:pointer; font-family:inherit;
    padding:5px 13px; font-size:13px; font-weight:600; line-height:1.4;
    background:var(--blue-tint); color:var(--blue);
    transition:transform .12s ease, opacity .12s;
  }
  .chip:active{transform:scale(.95)}
  .chip.gray{background:var(--fill2); color:var(--text2)}
  .chip.red{background:var(--red-tint); color:var(--red)}

  /* ---------- 通知横幅(iOS 通知风格)---------- */
  #banner{
    flex:0 0 auto; display:flex; align-items:center; gap:11px; flex-wrap:wrap;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
    padding:9px 16px; font-size:14px; z-index:1100;
  }
  .banner-ico{
    width:34px; height:34px; border-radius:9px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;
  }
  #banner .grow{flex:1 1 auto}

  /* ---------- 主区域 ---------- */
  #app{flex:1 1 auto; display:flex; min-height:0; position:relative}
  #map{flex:1 1 auto; min-width:0; background:var(--map-bg); z-index:1}
  .leaflet-container{font-family:inherit; font-size:13px}

  /* ---------- 侧栏(iOS 分组列表)---------- */
  #panel{
    flex:0 0 344px; max-width:344px; background:var(--bg);
    border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; z-index:1150;
  }
  .panel-scroll{overflow-y:auto; padding:14px 14px 28px; scrollbar-width:thin}
  .sheet-grabber{display:none}

  .sec-title{
    font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.3px; text-transform:uppercase;
    margin:8px 2px 8px; display:flex; align-items:center; gap:7px;
  }
  .badge{background:var(--fill2); color:var(--muted); border-radius:980px; font-size:11.5px; font-weight:600; padding:1px 9px}
  .group{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
  .sec-tools{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 10px}

  #locCard{padding:13px 15px; font-size:14px; line-height:1.65; word-break:break-all}
  #locCard .latlng{font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:13.5px; color:var(--blue); font-weight:600}
  #locCard .warn{color:var(--red)}
  #locCard h3{display:none}

  /* ---------- 标注行 ---------- */
  #pointList{list-style:none; margin:0; padding:0}
  .point-item + .point-item{border-top:.5px solid var(--line)}
  .row-main{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; transition:background .12s}
  .row-main:active{background:var(--fill)}
  .row-icon{
    width:32px; height:32px; border-radius:8px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;
    box-shadow:0 2px 5px var(--blue-tint);
  }
  .row-texts{flex:1; min-width:0}
  .row-title{font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row-sub{font-size:12px; color:var(--muted); margin-top:2px; font-family:ui-monospace,"SF Mono",Consolas,monospace}
  .row-note{font-size:13px; color:var(--text2); margin-top:4px; white-space:pre-wrap; word-break:break-word;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .chev{width:8px; height:14px; color:var(--muted); opacity:.55; flex:0 0 auto}
  .row-actions{display:flex; gap:7px; padding:0 14px 12px 58px}

  #emptyHint{font-size:13.5px; line-height:1.9; text-align:center; color:var(--muted); padding:22px 10px}

  /* ---------- 浮动按钮 ---------- */
  #fabPanel{
    display:none; position:absolute; right:16px; bottom:28px; z-index:1200;
    width:50px; height:50px; border-radius:50%; border:none; border:1px solid var(--line);
    background:var(--glass); color:var(--blue);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    cursor:pointer; box-shadow:var(--shadow);
    align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  #fabPanel:active{transform:scale(.92)}

  /* ---------- Leaflet 弹窗(iOS 卡片)---------- */
  .pop{display:flex; flex-direction:column; gap:9px; min-width:235px}
  .pop-coords{font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:12px; color:var(--muted)}
  .pop input,.pop textarea{
    width:100%; background:var(--fill); color:var(--text);
    border:1.5px solid transparent; border-radius:10px;
    padding:8px 11px; font-size:14px; font-family:inherit; resize:vertical;
    transition:border-color .15s;
  }
  .pop input:focus,.pop textarea:focus{outline:none; border-color:var(--blue)}
  .pop-actions{display:flex; gap:7px}
  .leaflet-popup-content-wrapper{
    background:var(--card); color:var(--text); border-radius:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.10), 0 12px 34px rgba(0,0,0,.16);
  }
  .leaflet-popup-tip{background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,.10)}
  .leaflet-popup-content{margin:15px 17px; line-height:1.45}
  .leaflet-popup-close-button{color:var(--muted)!important; font-size:22px!important; padding:6px 8px 0 0!important}

  /* ---------- Leaflet 控件(iOS 化)---------- */
  .leaflet-bar{border:none!important; box-shadow:none!important; border-radius:0}
  .leaflet-bar a{
    background:var(--card)!important; color:var(--text)!important;
    border-bottom:none!important; border-radius:10px!important; margin-bottom:7px;
    box-shadow:var(--shadow); width:32px!important; height:32px!important; line-height:32px!important;
    font-weight:500;
  }
  .leaflet-bar a:hover{background:var(--fill)!important}
  .leaflet-bar a:last-child{margin-bottom:0}
  .leaflet-control-layers{
    background:var(--glass)!important;
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--line)!important; border-radius:10px!important;
    box-shadow:var(--shadow)!important; color:var(--text);
  }
  .leaflet-control-layers-expanded{padding:9px 12px!important; font-size:13px}
  .leaflet-control-layers-toggle{filter:brightness(.35)}
  @media (prefers-color-scheme: dark){
    .leaflet-control-layers-toggle{filter:invert(1) brightness(1.8)}
  }
  #map .leaflet-control-attribution{
    background:var(--glass); color:var(--muted); font-size:10.5px; padding:2px 8px;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border-radius:7px 0 0 0;
  }
  #map .leaflet-control-attribution a{color:var(--blue)}

  /* ---------- 地图图钉 / 蓝点 ---------- */
  .pin-wrap{background:none!important; border:none!important}
  .pin{width:31px; height:43px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.30))}
  .bluedot{
    width:18px; height:18px; border-radius:50%; background:var(--blue); border:3px solid #fff;
    box-shadow:0 0 0 3px var(--blue-tint), 0 1px 6px rgba(0,0,0,.35);
    animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 3px var(--blue-tint), 0 1px 6px rgba(0,0,0,.35)}
    70%{box-shadow:0 0 0 17px rgba(0,122,255,0), 0 1px 6px rgba(0,0,0,.35)}
    100%{box-shadow:0 0 0 3px rgba(0,122,255,0), 0 1px 6px rgba(0,0,0,.35)}
  }

  /* ---------- Toast(iOS 通知横幅)---------- */
  #toast{
    position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 64px);
    transform:translateX(-50%) translateY(-12px) scale(.97);
    background:var(--glass); color:var(--text);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--line); border-radius:18px;
    padding:11px 20px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; z-index:2000;
    transition:opacity .28s, transform .28s; max-width:88vw; text-align:center;
    box-shadow:var(--shadow);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}

  /* ---------- 移动端(iOS Sheet)---------- */
  @media (max-width: 760px){
    .brand{font-size:19px}
    .brand small{display:none}
    #panel{
      position:absolute; left:0; right:0; bottom:0; max-width:none; flex:none;
      max-height:64dvh; border-left:none;
      border-radius:20px 20px 0 0;
      transform:translateY(101%); transition:transform .32s cubic-bezier(.32,.72,.35,1);
      box-shadow:0 -10px 44px rgba(0,0,0,.22);
      padding-bottom:env(safe-area-inset-bottom);
      background:var(--bg);
    }
    #panel.open{transform:translateY(0)}
    .sheet-grabber{
      display:block; width:38px; height:5px; border-radius:3px;
      background:var(--fill2); margin:8px auto 2px; flex:0 0 auto;
    }
    #fabPanel{display:flex}
    header .btn{padding:8px 13px; font-size:13.5px}
    .row-actions{padding-left:14px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">🌍 足迹地图<small>定位 · 标注 · 分享</small></div>
  <div class="actions">
    <button class="btn primary" id="btnLocate">📍 定位</button>
    <button class="btn" id="btnMarkHere" disabled>✚ 标记此处</button>
  </div>
</header>

<div id="banner" class="hidden">
  <span class="banner-ico">🧭</span>
  <span id="bannerText">来自分享的位置</span>
  <span class="grow"></span>
  <button class="btn primary small" id="bannerSave">保存到本地</button>
  <button class="btn small" id="bannerDismiss">忽略</button>
</div>

<div id="app">
  <div id="map"></div>

  <aside id="panel">
    <div class="sheet-grabber"></div>
    <div class="panel-scroll">
      <div class="sec-title">我的位置</div>
      <div class="group" id="locCard">
        <div id="locInfo" class="muted">尚未定位。点击右上角「定位」按钮获取当前 GPS / 网络位置。</div>
      </div>

      <div class="sec-title" style="margin-top:18px">位置标注 <span class="badge" id="pointCount">0</span></div>
      <div class="sec-tools">
        <button class="chip" id="btnShareAll">🔗 分享全部</button>
        <button class="chip gray" id="btnExport">导出</button>
        <button class="chip gray" id="btnImport">导入</button>
        <button class="chip red" id="btnClear">清空</button>
        <input type="file" id="fileImport" accept=".json,application/json" hidden>
      </div>
      <ul id="pointList" class="group"></ul>
      <div id="emptyHint" class="muted">
        还没有标注。<br>
        · 点「📍 定位」获取当前位置,再点「✚ 标记此处」收藏<br>
        · 在地图上<strong>右键 / 长按</strong>任意位置即可添加标注<br>
        · 每个标注可填写名称与备注评论,并单独分享
      </div>
    </div>
  </aside>

  <button id="fabPanel" title="标注列表" aria-label="标注列表">
    <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M9 6h12M9 12h12M9 18h12"/>
      <circle cx="4.2" cy="6" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="4.2" cy="12" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="4.2" cy="18" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'p' + Date.now() + Math.random().toString(36).slice(2, 8));
const fmtTime = ts => new Date(ts).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
const fmtLL = (la, ln) => `${la.toFixed(6)}, ${ln.toFixed(6)}`;

let toastTimer = null;
function toast(msg, ok = true){
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = ok ? 'var(--line)' : 'var(--danger)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}

function encB64(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decB64(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}

/* ============ WGS-84 ⇄ GCJ-02(高德底图纠偏)============ */
const _PI = 3.14159265358979324, _A = 6378245.0, _EE = 0.00669342162296594323;
function _tLat(x, y){
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*_PI) + 20*Math.sin(2*x*_PI)) * 2/3;
  r += (20*Math.sin(y*_PI) + 40*Math.sin(y/3*_PI)) * 2/3;
  r += (160*Math.sin(y/12*_PI) + 320*Math.sin(y*_PI/30)) * 2/3;
  return r;
}
function _tLng(x, y){
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*_PI) + 20*Math.sin(2*x*_PI)) * 2/3;
  r += (20*Math.sin(x*_PI) + 40*Math.sin(x/3*_PI)) * 2/3;
  r += (150*Math.sin(x/12*_PI) + 300*Math.sin(x/30*_PI)) * 2/3;
  return r;
}
const _outCN = (la, ln) => ln < 72.004 || ln > 137.8347 || la < 0.8293 || la > 55.8271;
function wgs2gcj(la, ln){
  if (_outCN(la, ln)) return [la, ln];
  let dLat = _tLat(ln - 105, la - 35), dLng = _tLng(ln - 105, la - 35);
  const rad = la / 180 * _PI;
  let magic = Math.sin(rad); magic = 1 - _EE * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((_A * (1 - _EE)) / (magic * sq) * _PI);
  dLng = (dLng * 180) / (_A / sq * Math.cos(rad) * _PI);
  return [la + dLat, ln + dLng];
}
function gcj2wgs(la, ln){
  const [gla, gln] = wgs2gcj(la, ln);
  return [la * 2 - gla, ln * 2 - gln]; // 一阶反解,误差 < 1m
}

/* ================= 地图 ================= */
if (!window.L){
  document.body.innerHTML = '<div style="padding:40px;font-size:15px;line-height:2">地图库(Leaflet CDN)加载失败,请检查网络后刷新。</div>';
  throw new Error('Leaflet not loaded');
}

const amapLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: '1234', maxZoom: 19, maxNativeZoom: 18, attribution: '© 高德地图', gcj: true
});
const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors', gcj: false
});
/* 低饱和素净瓦片,最贴合 Apple 风格;浅色/深色随系统 */
const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap · © CARTO', gcj: false
});
const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap · © CARTO', gcj: false
});

const preferDark = matchMedia('(prefers-color-scheme: dark)');
const map = L.map('map', { worldCopyJump: true, zoomControl: false }).setView([34, 106], 4);
L.control.zoom({ position: 'topleft' }).addTo(map);
(preferDark.matches ? cartoDark : cartoLight).addTo(map);
L.control.layers(
  { '浅色地图': cartoLight, '深色地图': cartoDark, '高德地图': amapLayer, 'OpenStreetMap': osmLayer },
  null, { position: 'topright' }
).addTo(map);

/* Carto 瓦片国内可能加载不畅:开局 6 连错且无成功时自动切高德 */
let tileFails = 0, tileOks = 0, userPickedLayer = false;
for (const l of [cartoLight, cartoDark]){
  l.on('tileload', () => tileOks++);
  l.on('tileerror', () => {
    if (++tileFails === 6 && tileOks === 0 && !userPickedLayer){
      map.removeLayer(l);
      amapLayer.addTo(map);
      renderAll();
      toast('浅色瓦片加载失败,已切换为高德地图');
    }
  });
}

const usingGCJ = () => map.hasLayer(amapLayer) && !!amapLayer.options.gcj;
const disp = ll => { const [la, ln] = usingGCJ() ? wgs2gcj(ll.lat, ll.lng) : [ll.lat, ll.lng]; return [la, ln]; };
const fromDisp = ll => usingGCJ() ? gcj2wgs(ll.lat, ll.lng) : [ll.lat, ll.lng];

/* ================= 状态与存储 ================= */
const LS_KEY = 'footprint-map-v1';
let storageOK = true;
function loadPoints(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ storageOK = false; return []; }
}
function savePoints(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(points)); }
  catch(e){ storageOK = false; }
}
let points = loadPoints();     // {id,lat,lng,title,note,createdAt,accuracy?}
let sharedTemp = [];           // 分享链接打开后的临时点(未保存)
let curFix = null;             // {lat,lng,accuracy}
let watchId = null;

/* ================= 图标 ================= */
function pinIcon(color){
  return L.divIcon({
    className: 'pin-wrap',
    html: `<svg class="pin" viewBox="0 0 24 34"><path fill="${color}" stroke="rgba(0,0,0,.25)" stroke-width=".6" d="M12 1.2c-5.6 0-10 4.3-10 9.7 0 6.9 8.4 16 9.2 16.9.4.4 1.2.4 1.6 0 .8-.9 9.2-10 9.2-16.9 0-5.4-4.4-9.7-10-9.7z"/><circle cx="12" cy="10.6" r="3.4" fill="rgba(255,255,255,.92)"/></svg>`,
    iconSize: [30, 42], iconAnchor: [15, 40], popupAnchor: [0, -36]
  });
}
const blueDotIcon = L.divIcon({ className: 'pin-wrap', html: '<div class="bluedot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

/* ================= 渲染 ================= */
const markersGroup = L.layerGroup().addTo(map);
const markersById = {};

function popupHtml(p){
  const acc = p.accuracy ? ` <span style="opacity:.65">±${Math.round(p.accuracy)}m</span>` : '';
  return `<div class="pop" data-id="${p.id}">
    <div class="pop-coords">${fmtLL(p.lat, p.lng)}${acc}</div>
    <input class="pop-title" placeholder="名称(可选,如:家 / 公司)" maxlength="60">
    <textarea class="pop-note" rows="3" placeholder="备注 / 评论..." maxlength="500"></textarea>
    <div class="pop-actions">
      <button class="btn primary small" data-act="save">保存</button>
      <button class="btn small" data-act="share">分享</button>
      <button class="btn danger small" data-act="del">删除</button>
    </div>
  </div>`;
}

function renderAll(){
  markersGroup.clearLayers();
  Object.keys(markersById).forEach(k => delete markersById[k]);

  for (const p of points){
    const m = L.marker(disp(p), { icon: pinIcon('#007AFF'), riseOnHover: true })
      .bindPopup(popupHtml(p), { maxWidth: 300, autoPanPadding: [24, 24] })
      .addTo(markersGroup);
    if (p.title) m.bindTooltip(esc(p.title), { direction: 'top', offset: [0, -36] });
    markersById[p.id] = m;
  }
  for (const t of sharedTemp){
    L.marker(disp(t), { icon: pinIcon('#FF9500') })
      .bindPopup(popupHtml(t), { maxWidth: 300, autoPanPadding: [24, 24] })
      .addTo(markersGroup);
  }
  if (curFix){
    const [la, ln] = wgs2gcj(curFix.lat, curFix.lng); // 蓝点画在图层坐标系里,GCJ 图层也纠偏
    const pos = usingGCJ() ? [la, ln] : [curFix.lat, curFix.lng];
    if (curFix.accuracy) L.circle(pos, { radius: curFix.accuracy, color: '#007AFF', weight: 1.5, fillColor: '#007AFF', fillOpacity: .12 }).addTo(markersGroup);
    L.marker(pos, { icon: blueDotIcon, zIndexOffset: 1000 }).addTo(markersGroup);
  }
  renderList();
}

function renderList(){
  $('#pointCount').textContent = points.length;
  $('#emptyHint').classList.toggle('hidden', points.length > 0);
  const ul = $('#pointList');
  ul.innerHTML = points.map(p => `
    <li class="point-item" data-id="${p.id}">
      <div class="row-main">
        <div class="row-icon">📍</div>
        <div class="row-texts">
          <div class="row-title"><span class="name">${esc(p.title) || '<span class="muted">未命名位置</span>'}</span></div>
          <div class="row-sub">${fmtLL(p.lat, p.lng)}${p.accuracy ? ' · ±' + Math.round(p.accuracy) + 'm' : ''} · ${fmtTime(p.createdAt)}</div>
          ${p.note ? `<div class="row-note">${esc(p.note)}</div>` : ''}
        </div>
        <svg class="chev" viewBox="0 0 8 14" fill="none"><path d="M1.2 1.2l5.8 5.8-5.8 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="row-actions">
        <button class="chip" data-act="share">分享</button>
        <button class="chip gray" data-act="edit">编辑</button>
        <button class="chip red" data-act="del">删除</button>
      </div>
    </li>`).join('');
}

/* ================= 点位 CRUD ================= */
function addPoint(lat, lng, extra = {}){
  const p = { id: uid(), lat: +lat, lng: +lng, title: '', note: '', createdAt: Date.now(), ...extra };
  points.unshift(p);
  savePoints();
  renderAll();
  return p;
}
function delPoint(id){
  points = points.filter(p => p.id !== id);
  savePoints();
  renderAll();
  toast('已删除');
}
function openPointPopup(id){
  const m = markersById[id];
  if (!m) return;
  m.openPopup(); // 先开弹窗(Leaflet autoPan 会自动平移),再飞行,避免动画时序竞态
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 13), { duration: .6 });
}

/* 弹窗打开时填充数据并绑定按钮 */
map.on('popupopen', e => {
  const root = e.popup.getElement().querySelector('.pop');
  if (!root) return;
  const id = root.dataset.id;
  const p = points.find(x => x.id === id) || sharedTemp.find(x => x.id === id);
  if (!p) return;
  root.querySelector('.pop-title').value = p.title || '';
  root.querySelector('.pop-note').value = p.note || '';
  root.querySelector('.pop-actions').onclick = ev => {
    const act = ev.target?.dataset?.act;
    if (act === 'save'){
      p.title = root.querySelector('.pop-title').value.trim();
      p.note = root.querySelector('.pop-note').value.trim();
      savePoints(); renderAll();
      map.closePopup();
      toast('已保存 ✓');
    } else if (act === 'share'){
      doSharePoint(p);
    } else if (act === 'del'){
      if (sharedTemp.some(x => x.id === id)){ // 分享临时点:仅从地图移除
        sharedTemp = sharedTemp.filter(x => x.id !== id);
        renderAll(); map.closePopup(); return;
      }
      map.closePopup();
      delPoint(id);
    }
  };
});

/* ================= 定位 ================= */
const locInfo = $('#locInfo');
function renderLocInfo(){
  if (!curFix){ locInfo.innerHTML = '尚未定位。点击右上角「定位」按钮获取当前 GPS / 网络位置。'; return; }
  locInfo.innerHTML =
    `<span class="latlng">${fmtLL(curFix.lat, curFix.lng)}</span><br>` +
    `精度:±${Math.round(curFix.accuracy || 0)} m · 更新于 ${fmtTime(Date.now())}` +
    (storageOK ? '' : '<br><span class="warn">⚠ 当前环境无法使用本地存储,数据仅保存在内存中</span>');
}

function startWatch(){
  if (!('geolocation' in navigator)){
    locInfo.innerHTML = '<span class="warn">此浏览器不支持定位(Geolocation)。</span>';
    toast('浏览器不支持定位', false); return;
  }
  const btn = $('#btnLocate');
  btn.disabled = true; btn.textContent = '⏳ 定位中…';
  watchId = navigator.geolocation.watchPosition(onFix, onLocErr, {
    enableHighAccuracy: true, timeout: 15000, maximumAge: 3000
  });
}
function stopWatch(){
  if (watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  const btn = $('#btnLocate');
  btn.disabled = false; btn.classList.remove('active'); btn.textContent = '📍 定位';
}
function onFix(pos){
  const { latitude, longitude, accuracy } = pos.coords;
  const first = !curFix;
  curFix = { lat: latitude, lng: longitude, accuracy };
  stopWatch();
  $('#btnMarkHere').disabled = false;
  renderLocInfo(); renderAll();
  if (first){
    map.flyTo(disp(curFix), 16, { duration: .8 });
    toast(`定位成功 ±${Math.round(accuracy || 0)}m`);
  }
}
function onLocErr(err){
  stopWatch();
  const msgs = {
    1: '定位权限被拒绝 —— 请在浏览器地址栏/系统设置中允许位置权限',
    2: '暂时获取不到位置信息(设备 GPS/网络定位不可用)',
    3: '定位超时,请到开阔处重试'
  };
  let msg = msgs[err && err.code] || '定位失败';
  if (!window.isSecureContext) msg += '<br><span class="warn">⚠ 当前页面不是 HTTPS,手机浏览器通常会直接禁用定位(用 https:// 或 localhost 访问)</span>';
  locInfo.innerHTML = `<span class="warn">${msg}</span>`;
  toast('定位失败:' + (msgs[err && err.code] || '未知错误'), false);
}

$('#btnLocate').addEventListener('click', () => { if (watchId === null) startWatch(); else stopWatch(); });
$('#btnMarkHere').addEventListener('click', () => {
  if (!curFix) return;
  const p = addPoint(curFix.lat, curFix.lng, { accuracy: curFix.accuracy });
  openPointPopup(p.id);
  toast('已标记当前位置,可填写名称与备注');
});

/* 地图右键 / 长按添加标注 */
map.on('contextmenu', e => {
  const [la, ln] = fromDisp(e.latlng);
  const p = addPoint(la, ln);
  openPointPopup(p.id);
});

/* ================= 分享 ================= */
function buildLink(payload){
  const base = location.href.split('#')[0];
  return base + '#pts=' + encB64(payload);
}
function stripPayload(list){
  return list.map(p => ({ lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6), title: p.title || '', note: p.note || '' }));
}
async function webShare({ title, text, url }){
  if (navigator.share){
    try { await navigator.share({ title, text, url }); return true; } catch(e){ if (e.name === 'AbortError') return true; }
  }
  return false;
}
async function doSharePoint(p){
  const link = buildLink(stripPayload([p]));
  const text = `📍 ${p.title || '我的位置'} (${fmtLL(p.lat, p.lng)})${p.note ? '\n💬 ' + p.note : ''}`;
  const shared = await webShare({ title: p.title || '位置分享', text: text + '\n' + link, url: link });
  if (!shared){
    const ok = await copyText(`${text}\n🔗 ${link}`);
    toast(ok ? '已复制分享内容(粘贴给好友即可)' : '复制失败,请手动复制链接', ok);
  }
}
async function doShareAll(){
  if (!points.length){ toast('还没有任何标注', false); return; }
  const link = buildLink(stripPayload(points));
  const text = `🗺 我在足迹地图上标注了 ${points.length} 个位置,点击链接查看:`;
  const shared = await webShare({ title: '足迹地图分享', text: text + '\n' + link, url: link });
  if (!shared){
    const ok = await copyText(`${text}\n🔗 ${link}`);
    toast(ok ? `已复制分享链接(含 ${points.length} 个标注)` : '复制失败,请手动复制', ok);
  }
}

/* ---------- 分享链接打开:解析 hash ---------- */
function parseShared(){
  const m = location.hash.match(/^#pts=(.+)$/) || location.hash.match(/^#p=(.+)$/);
  if (!m) return;
  try {
    let data = decB64(m[1]);
    if (!Array.isArray(data)) data = [data];
    const arr = data
      .filter(d => typeof d === 'object' && isFinite(+d.lat) && isFinite(+d.lng))
      .map(d => ({ id: uid(), lat: +d.lat, lng: +d.lng, title: d.title || '', note: d.note || '', createdAt: Date.now() }));
    if (!arr.length) return;
    sharedTemp = arr;
    renderAll();
    const bounds = L.latLngBounds(arr.map(p => disp(p)));
    map.fitBounds(bounds.pad(.25), { maxZoom: 16 });
    $('#bannerText').textContent = `地图上有 ${arr.length} 个来自分享链接的位置(橙色图钉)`;
    $('#banner').classList.remove('hidden');
  } catch(e){ /* 无效链接静默忽略 */ }
}
/* 页面内点击分享链接(hash 变化)时同样解析,无需刷新 */
window.addEventListener('hashchange', () => {
  if (/^#(pts|p)=/.test(location.hash)) parseShared();
});
$('#bannerSave').addEventListener('click', () => {
  points = [...sharedTemp.map(p => ({ ...p, id: uid(), createdAt: Date.now() })), ...points];
  sharedTemp = [];
  savePoints(); renderAll();
  $('#banner').classList.add('hidden');
  clearHash();
  toast(`已保存 ${points.length} 个位置到本地 ✓`);
});
$('#bannerDismiss').addEventListener('click', () => {
  sharedTemp = []; renderAll();
  $('#banner').classList.add('hidden');
  clearHash();
});
function clearHash(){
  history.replaceState(null, '', location.pathname + location.search);
}

/* ================= 导入 / 导出 ================= */
$('#btnExport').addEventListener('click', () => {
  if (!points.length){ toast('没有可导出的标注', false); return; }
  const blob = new Blob([JSON.stringify({ app: 'footprint-map', version: 1, exportedAt: new Date().toISOString(), points }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `足迹地图-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const arr = Array.isArray(data) ? data : (Array.isArray(data.points) ? data.points : []);
    const valid = arr.filter(d => isFinite(+d.lat) && isFinite(+d.lng))
      .map(d => ({ id: uid(), lat: +d.lat, lng: +d.lng, title: d.title || '', note: d.note || '', createdAt: d.createdAt || Date.now() }));
    if (!valid.length){ toast('文件里没有有效的位置数据', false); return; }
    points = [...valid, ...points];
    savePoints(); renderAll();
    toast(`已导入 ${valid.length} 个标注 ✓`);
  } catch(err){ toast('导入失败:文件不是有效的 JSON', false); }
});
$('#btnClear').addEventListener('click', () => {
  if (!points.length){ toast('列表已是空的', false); return; }
  if (!confirm(`确定删除全部 ${points.length} 个标注?此操作不可恢复(建议先导出备份)。`)) return;
  points = []; savePoints(); renderAll();
  toast('已清空');
});

/* ================= 列表交互(事件委托) ================= */
$('#pointList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  const li = e.target.closest('.point-item');
  if (!li) return;
  const id = li.dataset.id;
  const p = points.find(x => x.id === id);
  if (!p) return;
  if (!btn){ openPointPopup(id); return; }          // 点条目主体 → 飞过去
  if (btn.dataset.act === 'share') doSharePoint(p);
  else if (btn.dataset.act === 'edit') openPointPopup(id);
  else if (btn.dataset.act === 'del') delPoint(id);
});

/* ================= 其它 ================= */
map.on('baselayerchange', () => { userPickedLayer = true; renderAll(); }); // 切图层:记为用户选择并重算纠偏
$('#btnShareAll').addEventListener('click', doShareAll);

/* 移动端底部抽屉 */
const panel = $('#panel'), fab = $('#fabPanel');
const FAB_LIST_SVG = '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.2" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.2" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.2" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>';
const FAB_CLOSE_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
fab.innerHTML = FAB_LIST_SVG;
fab.addEventListener('click', () => {
  const open = panel.classList.toggle('open');
  fab.innerHTML = open ? FAB_CLOSE_SVG : FAB_LIST_SVG;
});

/* 调试/自动化句柄 */
window.__mapApp = { map, getPoints: () => points, addPoint, wgs2gcj, gcj2wgs, usingGCJ };

renderAll();
renderLocInfo();
parseShared();
if (!storageOK) toast('当前环境无法使用 localStorage,刷新后数据会丢失', false);
</script>
</body>
</html>
